<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b5122b">
  <title>Mis tarjetas NFC</title>
  <style>
    :root{--red:#b5122b;--ink:#202124;--muted:#646b73;--line:#e5e7eb;--bg:#f5f6f8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:520px;margin:0 auto;padding:28px 18px 40px}
    header{text-align:center;padding:22px 12px 18px}
    .mark{width:66px;height:66px;border-radius:20px;background:var(--red);color:white;display:grid;place-items:center;font-size:26px;font-weight:800;margin:0 auto 14px}
    h1{font-size:26px;line-height:1.15;margin:0 0 8px}header p{margin:0;color:var(--muted)}
    .links{display:grid;gap:12px;margin-top:16px}
    a.action{display:flex;align-items:center;gap:14px;padding:17px;background:white;border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;box-shadow:0 2px 7px #1111;min-height:78px}
    a.action:focus-visible{outline:3px solid #e7a1ac;outline-offset:2px}
    .ico{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;background:#fff0f2;border-radius:13px;font-size:22px}
    .copy{min-width:0;flex:1}.copy strong{display:block;font-size:16px}.copy small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
    .arrow{font-size:22px;color:#9298a0}
    .note{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
    .hidden{display:none!important}
  </style>
</head>
<body>
<main>
  <header>
    <div class="mark" aria-hidden="true">NFC</div>
    <h1>Tarjetas NFC</h1>
    <p>Selecciona un perfil para ver sus enlaces.</p>
  </header>
  <nav class="links" aria-label="Perfiles">
    <a class="action" href="./carlos/">
      <span class="ico" aria-hidden="true">👤</span><span class="copy"><strong>Carlos Acosta</strong><small>Contacto, nómina y BOE</small></span><span class="arrow" aria-hidden="true">›</span>
    </a>
  </nav>
  <p class="note">Página de acceso a perfiles NFC.</p>
</main>
</body>
</html>
