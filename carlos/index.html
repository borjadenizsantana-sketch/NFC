<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b5122b">
<title>Carlos Acosta | Contacto</title>
<style>
:root{--red:#b5122b;--ink:#202124;--muted:#646b73;--line:#e5e7eb;--bg:#f5f6f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:24px 18px 38px}.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:14px;margin:0 0 16px}
.hero{text-align:center;padding:20px 12px 24px}.avatar{width:82px;height:82px;border-radius:50%;margin:0 auto 14px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:27px;font-weight:750}
h1{font-size:28px;line-height:1.15;margin:0 0 7px}.subtitle{color:var(--muted);margin:0}.links{display:grid;gap:12px}
.action{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;box-shadow:0 2px 7px #1111;min-height:78px}
.action:focus-visible{outline:3px solid #e7a1ac;outline-offset:2px}.ico{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;background:#fff0f2;border-radius:13px;font-size:23px}
.copy{min-width:0;flex:1}.copy strong{display:block;font-size:16px}.copy small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.arrow{font-size:22px;color:#9298a0}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:23px}
</style>
</head>
<body>
<main>
<a class="back" href="../">← Volver a accesos</a>
<header class="hero">
<div class="avatar" aria-hidden="true">CA</div>
<h1>Carlos Acosta</h1>
<p class="subtitle">Contacto</p>
</header>
<nav class="links" aria-label="Acciones de contacto">
<a class="action" href="tel:+34661492256">
<span class="ico" aria-hidden="true">📞</span><span class="copy"><strong>Llamar a Carlos</strong><small>661 492 256</small></span><span class="arrow" aria-hidden="true">›</span>
</a>
<a class="action" href="./carlos-acosta.vcf" download>
<span class="ico" aria-hidden="true">👤</span><span class="copy"><strong>Guardar contacto</strong><small>Añadir Carlos Acosta a la agenda</small></span><span class="arrow" aria-hidden="true">›</span>
</a>
</nav>
<p class="note">Puedes llamar o guardar los datos de contacto.</p>
</main>
</body>
</html>
